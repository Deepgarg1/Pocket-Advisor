<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">How to Auto-Match UPI Debits to Recurring Bills &amp; Subscriptions</title>
<desc id="desc">Visual workflow showing on-device bank SMS detection matching utility bill payments to recurring trackers without cloud exposure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/>
    <stop offset="1" stop-color="#0f172a"/>
  </linearGradient>
  <linearGradient id="matchGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#10b981"/>
    <stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/>
<circle cx="1080" cy="90" r="170" fill="#06b6d4" opacity=".08"/>
<circle cx="140" cy="550" r="200" fill="#10b981" opacity=".06"/>

<!-- Header -->
<text x="64" y="68" fill="#34d399" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="3">POCKET ADVISOR • AUTOMATED RECONCILIATION</text>
<text x="64" y="122" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800">Auto-Matching UPI Debits to Recurring Bills</text>
<text x="64" y="160" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="22">On-Device Regex Parsing • Instant Bill Reconciliation • Zero Cloud Leakage</text>

<!-- 3 Steps Flow -->
<!-- Step 1: Bank SMS Alert -->
<rect x="64" y="210" width="320" height="270" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<rect x="88" y="234" width="76" height="28" rx="14" fill="rgba(56,189,248,0.2)"/>
<text x="126" y="253" text-anchor="middle" fill="#38bdf8" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">STEP 1</text>
<text x="88" y="295" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Bank SMS Arrives</text>
<rect x="88" y="315" width="272" height="135" rx="12" fill="#0b1220" stroke="#475569" stroke-width="1"/>
<text x="104" y="342" fill="#94a3b8" font-family="monospace" font-size="13">"INR 1,499.00 debited</text>
<text x="104" y="364" fill="#94a3b8" font-family="monospace" font-size="13">from A/c XX4821</text>
<text x="104" y="386" fill="#38bdf8" font-family="monospace" font-size="13">to ACT FIBERNET UPI</text>
<text x="104" y="408" fill="#94a3b8" font-family="monospace" font-size="13">Ref 429184029104"</text>

<!-- Arrow 1 -->
<path d="M 404 345 L 444 345" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="440,339 452,345 440,351" fill="#38bdf8"/>

<!-- Step 2: On-Device Regex Parser -->
<rect x="472" y="210" width="320" height="270" rx="18" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
<rect x="496" y="234" width="76" height="28" rx="14" fill="rgba(14,165,233,0.2)"/>
<text x="534" y="253" text-anchor="middle" fill="#0ea5e9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">STEP 2</text>
<text x="496" y="295" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Deterministic Parse</text>
<text x="496" y="335" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="16">• Amount: <tspan fill="#34d399" font-weight="700">₹1,499.00</tspan></text>
<text x="496" y="365" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="16">• Merchant: <tspan fill="#38bdf8" font-weight="700">ACT Fibernet</tspan></text>
<text x="496" y="395" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="16">• Category: <tspan fill="#f59e0b" font-weight="700">Utilities / Wi-Fi</tspan></text>
<text x="496" y="425" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="16">• Engine: <tspan fill="#a78bfa">Local CPU (&lt;1ms)</tspan></text>

<!-- Arrow 2 -->
<path d="M 812 345 L 852 345" stroke="#10b981" stroke-width="3"/>
<polygon points="848,339 860,345 848,351" fill="#10b981"/>

<!-- Step 3: Reconciled Bill -->
<rect x="880" y="210" width="256" height="270" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
<rect x="904" y="234" width="76" height="28" rx="14" fill="rgba(16,185,129,0.2)"/>
<text x="942" y="253" text-anchor="middle" fill="#10b981" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">STEP 3</text>
<text x="904" y="295" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Bill Reconciled</text>
<rect x="904" y="325" width="208" height="38" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
<text x="1008" y="350" text-anchor="middle" fill="#34d399" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">✓ Marked Paid</text>
<text x="904" y="395" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15">• Due Date Cleared</text>
<text x="904" y="425" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15">• Budget Updated</text>
<text x="904" y="455" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15">• Zero Duplicate Reminders</text>

<!-- Bottom Banner -->
<rect x="64" y="520" width="1072" height="90" rx="16" fill="rgba(6,78,59,0.3)" stroke="#059669" stroke-width="1"/>
<text x="96" y="555" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">Private On-Device Intelligence vs. Cloud Bill Scrapers</text>
<text x="96" y="585" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="16">Never share netbanking logins or Gmail OAuth tokens. Bank SMS alerts parse locally in SQLCipher.</text>
<text x="1110" y="570" text-anchor="end" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="15">pocketadvisor.in</text>
</svg>
