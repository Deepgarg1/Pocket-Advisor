<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgWelcome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.4)"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgWelcome)"/>

  <!-- Radial Ambient Orbs -->
  <circle cx="200" cy="180" r="220" fill="#6366f1" opacity="0.16" filter="url(#blurFilter)"/>
  <circle cx="1000" cy="450" r="250" fill="#a855f7" opacity="0.18" filter="url(#blurFilter)"/>

  <!-- Clean Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(100, 100)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="38" rx="19" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="24" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#818cf8" letter-spacing="1">PRODUCT LAUNCH</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Welcome to Pocket Advisor
    </text>
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="url(#accentGradient)" letter-spacing="-1">
      Intelligent, Private Wealth Tracking
    </text>

    <!-- Subtitle -->
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Stop typing every expense manually. Meet the native Android app that
    </text>
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      tracks UPI spending automatically, splits bills, and projects compounding wealth.
    </text>

    <!-- 3 Pillars Row -->
    <g transform="translate(0, 310)">
      <!-- Pillar 1 -->
      <rect x="0" y="0" width="310" height="110" rx="14" fill="url(#cardGlow)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="22" y="38" font-family="sans-serif" font-size="20">⚡</text>
      <text x="54" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Zero Manual Entry</text>
      <text x="22" y="70" font-family="sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Instant on-device UPI &amp; bank SMS parsing with zero cloud risk.</text>

      <!-- Pillar 2 -->
      <rect x="330" y="0" width="310" height="110" rx="14" fill="url(#cardGlow)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="352" y="38" font-family="sans-serif" font-size="20">👥</text>
      <text x="384" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Smart Bill Splitting</text>
      <text x="352" y="70" font-family="sans-serif" font-size="13" font-weight="400" fill="#94a3b8">2-stage greedy debt minimization eliminates awkward group math.</text>

      <!-- Pillar 3 -->
      <rect x="660" y="0" width="310" height="110" rx="14" fill="url(#cardGlow)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="682" y="38" font-family="sans-serif" font-size="20">📈</text>
      <text x="714" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Wealth Engineering</text>
      <text x="682" y="70" font-family="sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Home loan prepayment vs SIP comparison and step-up projection.</text>
    </g>

    <!-- Bottom App Tagline -->
    <g transform="translate(0, 460)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">
        Pocket Advisor Android App • Privacy-First Architecture • Now Available
      </text>
    </g>
  </g>
</svg>
