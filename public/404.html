<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) | Pocket Advisor</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#090d16" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --bg-app: #090d16;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --primary: #818cf8;
        --primary-btn: #4f46e5;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: var(--bg-app);
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .container {
        max-width: 560px;
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid var(--border-subtle);
        border-radius: 24px;
        padding: 48px 32px;
        backdrop-filter: blur(16px);
      }
      .code {
        font-size: clamp(4rem, 12vw, 6rem);
        font-weight: 800;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        color: var(--text-secondary);
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn-group {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        padding: 12px 24px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .btn-primary {
        background: var(--primary-btn);
        color: #ffffff;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-primary);
        border: 1px solid var(--border-subtle);
      }
      .btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for doesn't exist or has been moved to a new URL.</p>
      <div class="btn-group">
        <a href="/" class="btn btn-primary">Go to Home</a>
        <a href="/split" class="btn btn-secondary">Bill Splitter</a>
        <a href="/calculators" class="btn btn-secondary">Calculators</a>
      </div>
    </div>
  </body>
</html>
