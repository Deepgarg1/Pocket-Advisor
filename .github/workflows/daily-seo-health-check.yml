name: Daily SEO Health Check

on:
  schedule:
    # 09:00 Asia/Kolkata (03:30 UTC)
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-seo-health-check
  cancel-in-progress: true

jobs:
  live-seo-check:
    name: Check production SEO signals
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check sitemap, robots.txt, HTTP status, canonical and noindex
        run: node scripts/check-live-seo.js
