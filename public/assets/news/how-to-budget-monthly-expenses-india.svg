<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">How to Budget Monthly Expenses in India: The 50/30/20 Framework</title>
<desc id="desc">Visual guide illustrating the adaptive 50/30/20 budgeting rule for Indian salaries across Needs, Wants, and Compounding Investments.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/>
    <stop offset="1" stop-color="#111c33"/>
  </linearGradient>
  <linearGradient id="needsGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0284c7"/>
    <stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <linearGradient id="wantsGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <linearGradient id="saveGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#059669"/>
    <stop offset="1" stop-color="#34d399"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/>
<circle cx="1100" cy="80" r="180" fill="#38bdf8" opacity=".08"/>
<circle cx="100" cy="580" r="220" fill="#34d399" opacity=".06"/>

<!-- Header Pill & Title -->
<text x="64" y="68" fill="#38bdf8" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="3">POCKET ADVISOR • PERSONAL BUDGETING</text>
<text x="64" y="122" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800">Monthly Budget Architecture for Indian Earners</text>
<text x="64" y="160" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="22">The Adaptive 50/30/20 Allocation: Needs • Wants • Compounding Wealth</text>

<!-- 3 Allocation Cards -->
<!-- Card 1: Needs -->
<rect x="64" y="200" width="336" height="290" rx="20" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
<rect x="88" y="224" width="70" height="32" rx="16" fill="rgba(2,132,199,0.2)"/>
<text x="123" y="246" text-anchor="middle" fill="#38bdf8" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">50-60%</text>
<text x="88" y="295" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Needs &amp; Essentials</text>
<text x="88" y="328" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Rent &amp; Society Maintenance</text>
<text x="88" y="358" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Groceries &amp; Daily Essentials</text>
<text x="88" y="388" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Electricity, WiFi &amp; Water Bills</text>
<text x="88" y="418" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Health Insurance &amp; Commute</text>
<rect x="88" y="448" width="288" height="8" rx="4" fill="url(#needsGrad)"/>

<!-- Card 2: Wants -->
<rect x="432" y="200" width="336" height="290" rx="20" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
<rect x="456" y="224" width="70" height="32" rx="16" fill="rgba(139,92,246,0.2)"/>
<text x="491" y="246" text-anchor="middle" fill="#c084fc" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">20-30%</text>
<text x="456" y="295" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Lifestyle &amp; Wants</text>
<text x="456" y="328" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Dining Out &amp; Food Delivery</text>
<text x="456" y="358" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• OTT Subscriptions &amp; Hobbies</text>
<text x="456" y="388" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Weekend Travel &amp; Gadgets</text>
<text x="456" y="418" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Shopping &amp; Entertainment</text>
<rect x="456" y="448" width="288" height="8" rx="4" fill="url(#wantsGrad)"/>

<!-- Card 3: Savings & Compounding -->
<rect x="800" y="200" width="336" height="290" rx="20" fill="#0f172a" stroke="#059669" stroke-width="2"/>
<rect x="824" y="224" width="70" height="32" rx="16" fill="rgba(5,150,105,0.2)"/>
<text x="859" y="246" text-anchor="middle" fill="#34d399" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">20% MIN</text>
<text x="824" y="295" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Wealth &amp; Savings</text>
<text x="824" y="328" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Emergency Fund (Liquid FD)</text>
<text x="824" y="358" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Equity Mutual Fund SIPs</text>
<text x="824" y="388" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Voluntary PPF / NPS</text>
<text x="824" y="418" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">• Debt Principal Prepayments</text>
<rect x="824" y="448" width="288" height="8" rx="4" fill="url(#saveGrad)"/>

<!-- Bottom Tip Banner -->
<rect x="64" y="520" width="1072" height="90" rx="16" fill="rgba(30,58,138,0.3)" stroke="#3b82f6" stroke-width="1"/>
<text x="96" y="555" fill="#93c5fd" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">Practical Indian Rule: Pay Yourself First On Salary Day</text>
<text x="96" y="585" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="16">Automate your 20% SIP on the 1st to 5th of every month before discretionary spending begins.</text>
<text x="1110" y="570" text-anchor="end" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="15">pocketadvisor.in</text>
</svg>
